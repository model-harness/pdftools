<h1>Harbour Report</h1>
<p>The harbour handled more ships this year than last, and <strong>cargo tonnage rose by a tenth</strong>. The <em>north quay</em> was closed for repairs in March.</p>
<h2>Changes</h2>
<ul>
<li>A second crane was installed.</li>
<li>The ferry timetable moved to half-hourly sailings.</li>
</ul>
