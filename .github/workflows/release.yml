name: release

# Publishes a release tag: build.yml builds and tests the whole product on each platform at the
# tag, and this packages what it built, checks every binary carries the tag, and attaches the
# archives, their checksums and their build provenance to the tag's GitHub release, where
# install.sh and install.ps1 fetch them. Run it by hand to build a tag that is already pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pdfspec_*
          path: ${{ runner.temp }}/build
      # An artifact keeps no file modes, so the executables get theirs back before they are
      # archived. The asset names carry no version, so releases/latest/download/<name> always
      # resolves.
      - name: package
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            name="pdfspec_$target"
            [ -d "$build/$name" ] || { echo "build.yml uploaded no $name"; exit 1; }
            if [ "${target%_*}" = windows ]; then
              (cd "$build" && zip -qr "$dist/$name.zip" "$name")
            else
              chmod 0755 "$build/$name/pdfspec" "$build/$name/tesseract/tesseract"
              tar -C "$build" -czf "$dist/$name.tar.gz" "$name"
            fi
          done
          (cd "$dist" && sha256sum -- * > checksums.txt)
          ls -l "$dist"
      # The version comes from the tag through the build info, so check every binary carries it,
      # exactly: go version -m reads a binary built for any platform.
      - name: check the version
        run: |
          set -euo pipefail
          for exe in "$RUNNER_TEMP"/build/*/pdfspec "$RUNNER_TEMP"/build/*/pdfspec.exe; do
            got=$(go version -m "$exe" | awk '$1 == "mod" { print $3 }')
            [ "$got" = "$TAG" ] || { echo "$exe carries '$got', not $TAG"; exit 1; }
          done
          [ "$("$RUNNER_TEMP"/build/pdfspec_linux_amd64/pdfspec version | head -n 1)" = "pdfspec ${TAG#v}" ]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes
          fi
