name: release

# Builds pdfspec for each platform from a release tag, and attaches the archives, their checksums
# and their build provenance to the tag's GitHub release, where install.sh and install.ps1 fetch
# them. Run it by hand to build a tag that is already pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # pdfspec is pure Go, rasterizing through WebAssembly, so one runner builds every platform.
      # The asset names carry no version, so releases/latest/download/<name> always resolves.
      - name: build
        run: |
          set -euo pipefail
          mkdir -p build dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="pdfspec_${os}_${arch}"
            exe=pdfspec
            if [ "$os" = windows ]; then exe=pdfspec.exe; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/$name/$exe" ./cmd/pdfspec
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > checksums.txt)
      # The version comes from the tag through the build info, so check the binaries say it.
      - name: check the version
        run: |
          got=$(build/pdfspec_linux_amd64/pdfspec version | head -n 1)
          [ "$got" = "pdfspec ${TAG#v}" ] || { echo "built '$got' from $TAG"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
